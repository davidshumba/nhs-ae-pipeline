[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-ae-pipeline"
version = "0.0.1"
description = "A tested data pipeline for NHS England's monthly A&E performance data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "David Shumba" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
